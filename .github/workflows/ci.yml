name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ShellCheck
        run: shellcheck recalbox/*.sh
      - name: Byte-compile
        run: python -m py_compile recalbox/*.py pironman5/*.py pironman5/variants/*.py pironman5/variants/modules/*.py
      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q recalbox/tests
